[package]
name = "dedaub-monitoring"
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Query on-chain data on the Dedaub platform from the command line"
repository = "https://github.com/Dedaub/monitoring-cli"
readme = "README.md"

[[bin]]
name = "dedaub-monitoring"
path = "src/main.rs"

[dependencies]
alloy-dyn-abi = "1"
alloy-json-abi = "1"
alloy-primitives = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
ctrlc = { version = "3", features = ["termination"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
strip = true
